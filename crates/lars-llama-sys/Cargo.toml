[package]
name = "lars-llama-sys"
description = "llama.cpp, vendored at a pinned commit and statically linked, with committed bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "llama"
exclude = ["llama.cpp/.git*", "llama.cpp/docs", "llama.cpp/examples", "llama.cpp/tools", "llama.cpp/tests",
           "llama.cpp/models", "llama.cpp/media", "llama.cpp/gguf-py", "llama.cpp/scripts"]

[build-dependencies]
cmake = "0.1"
