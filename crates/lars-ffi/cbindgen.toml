language = "C"
header = "/* LARS SDK C ABI. Generated by cbindgen from crates/lars-ffi/src/lib.rs; do not edit. */"
include_guard = "LARS_H"
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true

[export]
include = ["LarsEngine"]

[export.rename]
"LarsEngine" = "lars_engine"
"LarsCallback" = "lars_callback"

[enum]
prefix_with_name = true
