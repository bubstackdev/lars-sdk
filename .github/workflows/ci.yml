name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p lars-core --all-targets -- -D warnings
      - run: cargo test -p lars-core

  llama:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p lars-llama -p lars-dev -p lars-runtime -p lars-ffi --all-targets -- -D warnings
      - run: cargo build --release -p lars-dev
      # Model tests need a GGUF (LARS_TEST_GGUF) and skip without one; the runtime and the C ABI
      # are tested on mock packs (the C smoke test runs on Unix, under leaks on macOS).
      - run: cargo test --release -p lars-llama -p lars-runtime -p lars-ffi
      - name: lars.h is up to date
        if: runner.os == 'Linux'
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/lars-ffi/cbindgen.toml --crate lars-ffi --output /tmp/lars.h
          diff -u crates/lars-ffi/include/lars.h /tmp/lars.h
