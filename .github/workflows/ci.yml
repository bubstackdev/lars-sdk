name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p lars-core --all-targets -- -D warnings
      - run: cargo test -p lars-core

  llama:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p lars-llama -p lars-dev -p lars-runtime -p lars-ffi -p moedex-lars -p moedex-lars-derive --all-targets -- -D warnings
      - run: cargo build --release -p lars-dev
      # Model tests need a GGUF (LARS_TEST_GGUF) and skip without one; the runtime and the C ABI
      # are tested on mock packs (the C smoke test runs on Unix, under leaks on macOS).
      - run: cargo test --release -p lars-llama -p lars-runtime -p lars-ffi -p moedex-lars
      - name: lars.h is up to date
        if: runner.os == 'Linux'
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/lars-ffi/cbindgen.toml --crate lars-ffi --output /tmp/lars.h
          diff -u crates/lars-ffi/include/lars.h /tmp/lars.h

  ts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.node == 24
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-native.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: bun test/bun-smoke.ts
        if: matrix.node == 24

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: cargo build --release -p lars-ffi
      - name: test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) lib=liblars.dylib ;; Linux) lib=liblars.so ;; Windows) lib=lars.dll ;;
          esac
          LARS_NATIVE="$PWD/target/release/$lib" dotnet test dotnet/Moedex.Lars.Tests -c Release
      - run: dotnet build dotnet/examples/MolarTriage -c Release
