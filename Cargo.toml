[workspace]
resolver = "3"
members = ["crates/lars-core", "crates/lars-llama-sys", "crates/lars-llama", "crates/lars-dev", "crates/lars-runtime", "crates/lars-ffi", "crates/lars-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/moedex/lars-sdk"
rust-version = "1.85"

[workspace.dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
